<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101510">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='18' fill='%231a211a' stroke='%23536044'/%3E%3Ctext x='20' y='27' text-anchor='middle' font-size='23' fill='%23c8f169'%3E%E2%86%97%3C/text%3E%3C/svg%3E">
  <title>Closer — a connection game</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');
    :root{--ink:#f4f4e9;--muted:#a3a99d;--bg:#101510;--panel:#1a211a;--line:#313a30;--lime:#c8f169;--coral:#ff806d;--mint:#83d9bb;--serif:Georgia,serif;--sans:'DM Sans',Arial,sans-serif;--display:Manrope,Arial,sans-serif;--mono:'DM Mono',monospace}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh;background-image:radial-gradient(ellipse at 70% 8%,rgba(97,133,66,.13),transparent 38%),radial-gradient(ellipse at 6% 96%,rgba(255,128,109,.08),transparent 32%)}
    button{font:inherit;color:inherit}button:focus-visible{outline:3px solid var(--lime);outline-offset:3px}.shell{max-width:1180px;min-height:100vh;margin:auto;padding:26px 48px 36px;display:flex;flex-direction:column}
    header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:20px}.brand{display:flex;align-items:center;gap:12px;font:800 16px var(--display);letter-spacing:-.04em}.brand-mark{width:34px;height:34px;border:1px solid #536044;border-radius:50%;display:grid;place-items:center;color:var(--lime);font-size:19px}.top-note{font:11px var(--mono);letter-spacing:.1em;color:var(--muted);text-transform:uppercase}.main{flex:1;display:grid;grid-template-columns:1fr 320px;gap:68px;align-items:center;padding:46px 0 42px}.eyebrow{display:flex;align-items:center;gap:10px;font:11px var(--mono);color:var(--lime);letter-spacing:.15em;text-transform:uppercase;margin-bottom:20px}.eyebrow:before{content:'';width:24px;height:1px;background:var(--lime)}h1,h2,p{margin-top:0}h1{font:700 clamp(46px,6vw,78px)/.98 var(--display);letter-spacing:-.075em;margin-bottom:22px;max-width:670px}h1 em{font-family:var(--serif);font-weight:400;color:var(--lime);letter-spacing:-.06em}.lede{max-width:555px;color:#c0c5b9;font-size:17px;line-height:1.75;margin-bottom:27px}.hero-actions{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.primary{background:var(--lime);color:#15200d;border:0;border-radius:999px;padding:15px 23px;font:700 14px var(--display);cursor:pointer;transition:transform .18s,background .18s}.primary:hover{transform:translateY(-2px);background:#d6ff80}.secondary{background:transparent;border:0;color:var(--muted);font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:4px}.meta{display:flex;gap:20px;margin-top:35px;font:10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:#7f887c}.meta span{display:flex;align-items:center;gap:8px}.meta i{width:5px;height:5px;background:var(--coral);border-radius:50%}
    .art{position:relative;min-height:410px;display:grid;place-items:center}.orb{position:absolute;width:292px;height:292px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#e0ff9a 0,#bbdf70 25%,#768e47 66%,#39472c 100%);box-shadow:0 0 95px rgba(173,220,91,.12);animation:float 7s ease-in-out infinite}.orb:before,.orb:after{content:'';position:absolute;border:1px solid rgba(241,255,214,.65);border-radius:50%;inset:30px 67px;transform:rotate(48deg)}.orb:after{inset:55px 11px;transform:rotate(-38deg);border-color:rgba(241,255,214,.3)}.orbit{position:absolute;width:362px;height:362px;border:1px solid #384332;border-radius:50%;transform:rotate(-28deg) scaleY(.42)}.orbit:after{content:'';position:absolute;width:8px;height:8px;border-radius:50%;background:var(--coral);top:30px;left:63px;box-shadow:0 0 15px var(--coral)}.art-caption{position:absolute;bottom:15px;right:5px;color:#a6ad9c;font:10px var(--mono);letter-spacing:.1em;text-transform:uppercase}
    .card{grid-column:1/-1;max-width:810px;width:100%;margin:auto}.game-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}.back{background:none;border:0;color:var(--muted);cursor:pointer;font-size:13px}.progress-wrap{display:flex;align-items:center;gap:13px;width:min(55%,400px)}.progress-label{font:10px var(--mono);color:var(--muted);white-space:nowrap}.progress{height:3px;background:#30382f;flex:1;border-radius:9px;overflow:hidden}.progress>span{display:block;width:0;height:100%;background:var(--lime);transition:width .4s}.round{font:10px var(--mono);color:var(--lime)}.scenario-box{background:linear-gradient(145deg,#1d261d,#171e17);border:1px solid #343e31;border-radius:18px;padding:31px 37px 33px;position:relative;overflow:hidden}.scenario-box:after{content:'“';position:absolute;right:27px;top:-34px;font:200px/1 var(--serif);color:rgba(200,241,105,.07)}.tag{font:10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--coral);margin-bottom:20px;position:relative}.scenario-box h2{font:600 clamp(23px,3vw,34px)/1.3 var(--display);letter-spacing:-.04em;max-width:680px;margin-bottom:11px;position:relative}.scenario-box p{color:#aab1a5;line-height:1.6;margin:0;max-width:650px;font-size:14px;position:relative}.prompt{font:11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:27px 0 12px}.choices{display:grid;gap:10px}.choice{width:100%;display:flex;align-items:center;text-align:left;gap:15px;padding:15px 18px;border:1px solid #354034;border-radius:11px;background:#171d17;cursor:pointer;transition:background .16s,border .16s,transform .16s;line-height:1.45;font-size:14px;color:#e3e7dd}.choice:hover:not(:disabled){background:#222b20;border-color:#728551;transform:translateX(3px)}.choice:disabled{cursor:default}.choice-key{flex:none;width:26px;height:26px;border:1px solid #46513f;border-radius:50%;display:grid;place-items:center;color:#a9b39d;font:11px var(--mono)}.choice.good{border-color:var(--mint);background:rgba(131,217,187,.09)}.choice.bad{border-color:#b45f54;background:rgba(255,128,109,.06)}.choice.good .choice-key{background:var(--mint);color:#17231b;border-color:var(--mint)}.choice.bad .choice-key{background:var(--coral);color:#291713;border-color:var(--coral)}.feedback{margin-top:15px;border-left:2px solid var(--mint);padding:4px 0 4px 14px;color:#d4ded2;font-size:13px;line-height:1.65;animation:fade .25s}.feedback strong{color:var(--mint)}.next-row{display:flex;justify-content:flex-end;margin-top:15px}.next-row .primary{padding:12px 19px;font-size:13px}.hidden{display:none!important}
    .side{border:1px solid var(--line);border-radius:16px;padding:22px 23px;background:rgba(25,32,25,.75)}.side-label{font:10px var(--mono);letter-spacing:.13em;color:var(--muted);text-transform:uppercase}.scoreline{display:flex;align-items:baseline;gap:7px;margin:12px 0 5px}.score{font:600 43px var(--display);letter-spacing:-.07em}.outof{color:#778174;font:12px var(--mono)}.side-copy{font-size:12px;line-height:1.65;color:#a1aa9d;margin:0}.divider{height:1px;background:var(--line);margin:19px 0}.skill-row{display:flex;align-items:center;justify-content:space-between;margin-top:12px;font-size:12px;color:#c5ccbf}.skill-row span:last-child{font:10px var(--mono);color:var(--lime)}.skill-dots{display:flex;gap:4px;margin-left:auto;margin-right:8px}.skill-dots i{width:5px;height:5px;background:#384333;border-radius:50%}.skill-dots i.on{background:var(--lime)}.note{font-size:10px;line-height:1.6;color:#788174;margin-top:18px}.result{text-align:center;padding:25px 0 10px}.result .eyebrow{justify-content:center}.result h2{font:700 clamp(36px,5vw,58px)/1.05 var(--display);letter-spacing:-.07em;margin-bottom:13px}.result p{max-width:515px;margin:0 auto 25px;color:#adb6a8;line-height:1.7}.result-score{display:inline-flex;align-items:baseline;gap:8px;border:1px solid #414a39;border-radius:99px;padding:9px 18px;margin:0 0 24px;color:var(--lime);font:500 14px var(--mono)}footer{border-top:1px solid var(--line);padding-top:16px;display:flex;justify-content:space-between;gap:20px;color:#768073;font:10px var(--mono);letter-spacing:.02em}.footer-right{color:#a6ad9e}@keyframes float{50%{transform:translateY(-13px)}}@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
    @media(max-width:850px){.shell{padding:20px 28px 24px}.main{grid-template-columns:1fr 250px;gap:20px}.orb{width:220px;height:220px}.orbit{width:282px;height:282px}.art{min-height:340px}.meta{gap:12px}}
    @media(max-width:650px){.shell{padding:16px 19px 18px;min-height:100svh}header{padding-bottom:15px}.top-note{font-size:9px}.main{display:flex;flex-direction:column;align-items:stretch;gap:2px;padding:38px 0 28px}.hero{order:1}h1{font-size:52px;max-width:450px;margin-bottom:16px}.lede{font-size:15px;line-height:1.65;margin-bottom:20px}.art{order:0;min-height:205px;margin-bottom:6px;overflow:hidden}.orb{width:158px;height:158px}.orb:before{inset:18px 39px}.orb:after{inset:31px 7px}.orbit{width:220px;height:220px}.art-caption{right:0;bottom:12px;font-size:9px}.eyebrow{margin-bottom:13px}.meta{margin-top:24px;flex-wrap:wrap;font-size:9px}.side{order:2;margin-top:20px}.card{width:100%}.scenario-box{padding:24px 21px 25px}.scenario-box:after{right:9px}.scenario-box h2{font-size:26px}.scenario-box p{font-size:13px}.choice{font-size:13px;padding:13px}.progress-wrap{width:55%;gap:8px}.progress-label{font-size:9px}.back{font-size:12px}.game-top{margin-bottom:13px}.prompt{margin-top:21px}footer{font-size:9px;line-height:1.5}.footer-right{text-align:right}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <div class="shell">
    <header><div class="brand"><span class="brand-mark">↗</span> closer</div><div class="top-note">A game about being good to each other</div></header>
    <main id="app" class="main" aria-live="polite"></main>
    <footer><span>NO PERFECT ANSWERS. JUST BETTER CONVERSATIONS.</span><span class="footer-right">A thoughtful little game · 16+</span></footer>
  </div>
  <script>
    const rounds = [
      {tag:'01 / Consent',title:'You’re getting closer. Your partner goes quiet and seems unsure.',detail:'You like them, and you want to make sure you both feel comfortable.',prompt:'What do you do?',choices:[
        {text:'Pause, check in, and make it easy to say “not now.”',good:true,feedback:'Exactly. Consent should be freely given, clear, and ongoing. A pause is a good moment to check in without pressure.'},
        {text:'Keep going unless they specifically tell you to stop.',feedback:'Silence isn’t a yes. Pause and check in; consent needs to be freely given, not assumed.'},
        {text:'Try to persuade them so the mood doesn’t get awkward.',feedback:'Pressure can make it hard to choose freely. A caring check-in gives both people room to say what they want.'}
      ]},
      {tag:'02 / Boundaries',title:'You’re talking about boundaries. They share something they’re not comfortable with.',detail:'You may feel differently, but you want the conversation to stay respectful.',prompt:'What’s a good response?',choices:[
        {text:'Thank them for telling you, and respect that boundary without bargaining.',good:true,feedback:'A boundary isn’t an invitation to negotiate. Thanking someone for being honest helps build trust.'},
        {text:'Ask them to explain until you’re satisfied with the reason.',feedback:'They don’t owe you a justification. You can listen, respect the boundary, and talk about what feels good for both of you.'},
        {text:'Agree for now, then bring it up again later to change their mind.',feedback:'Repeatedly revisiting a clear no can become pressure. Respect it, and let them decide if they ever want to reopen the conversation.'}
      ]},
      {tag:'03 / Safer sex',title:'You’re considering becoming sexually active together.',detail:'You both want to feel prepared, respected, and able to make informed choices.',prompt:'What’s worth discussing beforehand?',choices:[
        {text:'Protection, contraception, STI testing, and what each of you is comfortable with.',good:true,feedback:'Good call. An honest, pressure-free conversation helps people make informed choices. A healthcare professional can help with personal options.'},
        {text:'Nothing—bringing it up would ruin the spontaneity.',feedback:'Talking beforehand can actually ease nerves. Protection, contraception, testing, and boundaries are all reasonable topics.'},
        {text:'Only protection; the other details are someone else’s responsibility.',feedback:'Shared decisions work best when everyone can ask questions and share responsibility. You can discuss what each person needs.'}
      ]},
      {tag:'04 / Communication',title:'You’re not sure what the other person enjoys or wants.',detail:'You don’t want to guess, and you want to hear an honest answer.',prompt:'How do you find out?',choices:[
        {text:'Ask kindly, listen, and share what feels right for you too.',good:true,feedback:'Yes. Clear, kind questions and active listening make room for an honest conversation—without needing anyone to guess.'},
        {text:'Assume they want the same things you do.',feedback:'People are different. Asking and listening is more reliable—and more considerate—than guessing.'},
        {text:'Wait for them to bring it up; your questions might offend them.',feedback:'A gentle question can show care. You can ask at a comfortable time and make clear there’s no pressure to answer.'}
      ]},
      {tag:'05 / Safer sex',title:'A condom is part of the plan, but the one you have is past its expiry date.',detail:'You want to reduce risk and avoid making assumptions about what to do next.',prompt:'What’s the safest next step?',choices:[
        {text:'Get an in-date condom and follow its package instructions.',good:true,feedback:'Right. Check expiry and packaging, and follow the instructions. Condoms reduce the risk of STIs and pregnancy, but no method is perfect.'},
        {text:'Use it anyway; an expiry date is just a suggestion.',feedback:'Don’t use an expired or damaged condom. Get an in-date one and check its packaging and instructions.'},
        {text:'Assume another birth-control method also prevents STIs.',feedback:'Many contraceptive methods don’t protect against STIs. Condoms help reduce STI risk; a clinician can explain options.'}
      ]},
      {tag:'06 / Readiness',title:'A friend says everyone your age is doing it, so you should too.',detail:'You’re not sure you’re ready, and you’re allowed to take your time.',prompt:'What do you remind yourself?',choices:[
        {text:'There’s no deadline. It should be my choice, without pressure.',good:true,feedback:'Absolutely. Readiness is personal. You can wait, change your mind, or say no at any time.'},
        {text:'I should do it so I don’t get left behind.',feedback:'You don’t owe anyone a timeline. Your choice should be based on what feels right for you, not pressure.'},
        {text:'If I say yes once, I can’t change my mind.',feedback:'You can change your mind at any point. Consent is ongoing, and anyone can stop whenever they want.'}
      ]},
      {tag:'07 / Getting support',title:'You have a question about contraception or STI testing, but feel awkward asking.',detail:'Getting accurate information can help you make choices that work for you.',prompt:'Where could you turn?',choices:[
        {text:'A healthcare professional or trusted sexual-health clinic.',good:true,feedback:'That’s a strong option. Professionals can give confidential, accurate advice; ask about privacy rules where you live.'},
        {text:'A random social-media post that sounds confident.',feedback:'Online claims can be unreliable. A qualified healthcare professional or sexual-health clinic is a better source.'},
        {text:'Avoid asking; if there were a problem, I’d probably know.',feedback:'Many STIs may have no obvious symptoms. Testing and professional advice are useful ways to get accurate information.'}
      ]},
      {tag:'08 / Respect',title:'Someone you’re dating says they want to stop and head home.',detail:'You feel disappointed, but you care about them and want them to feel safe.',prompt:'What do you say?',choices:[
        {text:'“Of course. Thanks for telling me. Want me to help you get home?”',good:true,feedback:'A caring response respects their choice and checks what support they want. A no doesn’t need to be defended.'},
        {text:'“But you came all this way. You owe me a chance.”',feedback:'No one owes intimacy, regardless of plans or past choices. Respect their decision without guilt or pressure.'},
        {text:'Go quiet and make them feel bad so they reconsider.',feedback:'Guilt isn’t consent. Respect the choice, and communicate your feelings later without trying to change their answer.'}
      ]}
    ];
    let index=0,score=0,answered=false,screen='home';
    const app=document.getElementById('app');
    function home(){screen='home';app.className='main';app.innerHTML=`<section class="hero"><div class="eyebrow">A small game for real life</div><h1>Good connection<br>starts with <em>conversation.</em></h1><p class="lede">Explore consent, boundaries, safer sex, and communication through everyday moments. No trick questions—just a little practice choosing care.</p><div class="hero-actions"><button class="primary" id="start">Let’s play <span aria-hidden="true"> ↗</span></button><button class="secondary" id="about">What’s this about?</button></div><div class="meta"><span><i></i> 8 quick choices</span><span><i></i> Go at your own pace</span><span><i></i> No wrong way to learn</span></div></section><div class="art" aria-hidden="true"><div class="orbit"></div><div class="orb"></div><div class="art-caption">Care is a conversation</div></div><aside class="side"><div class="side-label">A note before you start</div><div class="divider"></div><p class="side-copy">This is a fictional, educational game—not medical advice. There’s no score for being ready, and you never owe anyone intimacy. For personal health questions, talk with a qualified healthcare professional.</p><div class="note">Designed to be thoughtful, not explicit. Intended for older teens and adults.</div></aside>`;
      document.getElementById('start').onclick=()=>{index=0;score=0;renderRound()};document.getElementById('about').onclick=()=>alert('Closer is a short educational game about consent, communication, boundaries, and sexual health. It’s not medical advice. Your choices are private to this page and aren’t stored.');}
    function renderRound(){screen='game';answered=false;const r=rounds[index];app.className='main';app.innerHTML=`<section class="card"><div class="game-top"><button class="back" id="quit">← Start over</button><div class="progress-wrap"><span class="progress-label">YOUR JOURNEY</span><div class="progress"><span style="width:${index/rounds.length*100}%"></span></div><span class="round">${String(index+1).padStart(2,'0')} / ${rounds.length}</span></div></div><article class="scenario-box"><div class="tag">${r.tag}</div><h2>${r.title}</h2><p>${r.detail}</p></article><div class="prompt">${r.prompt}</div><div class="choices" role="group" aria-label="Choose a response">${r.choices.map((c,i)=>`<button class="choice" data-choice="${i}"><span class="choice-key">${String.fromCharCode(65+i)}</span><span>${c.text}</span></button>`).join('')}</div><div id="response" aria-live="polite"></div></section>`;
      document.getElementById('quit').onclick=home;app.querySelectorAll('.choice').forEach(b=>b.onclick=()=>choose(Number(b.dataset.choice)));}
    function choose(n){if(answered)return;answered=true;const r=rounds[index],c=r.choices[n];if(c.good)score++;app.querySelectorAll('.choice').forEach((b,i)=>{b.disabled=true;if(r.choices[i].good)b.classList.add('good');if(i===n&&!c.good)b.classList.add('bad')});const response=document.getElementById('response');response.innerHTML=`<div class="feedback"><strong>${c.good?'Thoughtful choice.':'A chance to learn.'}</strong> ${c.feedback}</div><div class="next-row"><button class="primary" id="next">${index===rounds.length-1?'See your reflection':'Next moment'} <span aria-hidden="true"> →</span></button></div>`;document.getElementById('next').onclick=()=>{index++;index<rounds.length?renderRound():finish()};}
    function finish(){screen='result';app.className='main';let msg=score>=7?'You made space for care.':score>=4?'Good conversations take practice.':'Every good conversation starts somewhere.';app.innerHTML=`<section class="card result"><div class="eyebrow">That’s a wrap</div><h2>${msg}</h2><p>You chose thoughtful responses in <strong style="color:var(--lime)">${score} of ${rounds.length}</strong> moments. There’s no grade here—the useful part is carrying curiosity, respect, and clear communication into real conversations.</p><div class="result-score">${score} / ${rounds.length} <span style="color:#a3a99d;font-size:10px">THOUGHTFUL MOMENTS</span></div><div><button class="primary" id="again">Play again ↻</button> <button class="secondary" id="home">Back to start</button></div><div class="side" style="max-width:540px;margin:35px auto 0;text-align:left"><div class="side-label">Keep in mind</div><div class="divider"></div><p class="side-copy">Consent should be freely given, reversible, informed, enthusiastic, and specific. Sexual-health needs vary; for personal advice, speak with a qualified healthcare professional or local sexual-health clinic.</p></div></section>`;document.getElementById('again').onclick=()=>{index=0;score=0;renderRound()};document.getElementById('home').onclick=home;}
    document.addEventListener('keydown',e=>{if(screen==='game'&&!answered&&['a','b','c'].includes(e.key.toLowerCase())){const n=e.key.toLowerCase().charCodeAt(0)-97;if(rounds[index].choices[n])choose(n)}else if(screen==='game'&&answered&&e.key==='Enter'){document.getElementById('next')?.click()}});
    home();
  </script>
</body>
</html>
